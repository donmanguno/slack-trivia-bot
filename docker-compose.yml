services:
  trivia-bot:
    image: ghcr.io/donmanguno/slack-trivia-bot:latest
    # Uncomment to build from source instead of pulling the image:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/trivia.db
    volumes:
      - trivia-data:/data
    # Health check will be inherited from Dockerfile HEALTHCHECK instruction
    # To override here, uncomment and modify:
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
    #   interval: 30s
    #   timeout: 5s
    #   retries: 3
    #   start_period: 10s

volumes:
  trivia-data:
